services:
  aw-gateway:
    build: ./gateway
    container_name: aw-gateway
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env, e.g. openssl rand -hex 32}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      # Optional: leave unset to disable the "Login with Authentik" option and
      # only offer local username/password login.
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
    ports:
      - "5600:8080"
    volumes:
      - gateway-data:/data
    depends_on:
      - aw-server-alice

  # One aw-server instance per user, kept off the host network - only
  # aw-gateway can reach it. To add another user:
  #   1. Copy this block, rename "alice" everywhere (service name, volume).
  #   2. docker compose up -d --build
  #   3. docker compose exec aw-gateway python scripts/create_user.py <name>
  aw-server-alice:
    build:
      context: .
      args:
        AW_VERSION: "0.13.2"
    image: activitywatch-server:0.13.2
    restart: unless-stopped
    volumes:
      - aw-data-alice:/config

volumes:
  gateway-data:
  aw-data-alice:
