<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sign in - ActivityWatch</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1e1e1e; color: #eee;
           display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    form { background: #2a2a2a; padding: 2rem; border-radius: 8px; width: 280px; }
    h1 { font-size: 1.1rem; margin: 0 0 1.2rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; }
    input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; border-radius: 4px;
            border: 1px solid #444; background: #1e1e1e; color: #eee; box-sizing: border-box; }
    button { width: 100%; padding: 0.6rem; border: none; border-radius: 4px;
             background: #4caf50; color: white; font-weight: bold; cursor: pointer; }
    .error { color: #f44336; font-size: 0.85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>ActivityWatch</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}" />
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autofocus required />
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required />
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
